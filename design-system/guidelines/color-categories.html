<!-- @dsCard group="Colors" viewport="700x120" name="Categorias (~10)" subtitle="Editoriais, distinguíveis entre si e do cobalto — classificam gastos" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(10,1fr);gap:8px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:56px;border-radius:10px;}
  .n{font-family:var(--mv-font-mono);font-size:9px;color:var(--mv-text-muted);text-align:center;}
</style></head>
<body><div class="wrap">
  <div class="sw"><div class="chip" style="background:var(--mv-cat-01)"></div><div class="n">01</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-02)"></div><div class="n">02</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-03)"></div><div class="n">03</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-04)"></div><div class="n">04</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-05)"></div><div class="n">05</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-06)"></div><div class="n">06</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-07)"></div><div class="n">07</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-08)"></div><div class="n">08</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-09)"></div><div class="n">09</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-cat-10)"></div><div class="n">10</div></div>
</div></body></html>
