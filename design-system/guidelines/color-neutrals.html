<!-- @dsCard group="Colors" viewport="700x140" name="Neutros (tinta → off-white)" subtitle="Carregam ~90% da interface — texto e superfícies" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);}
  .wrap{padding:20px;}
  .scale{display:grid;grid-template-columns:repeat(11,1fr);gap:6px;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:52px;border-radius:8px;border:1px solid var(--mv-border-subtle);}
  .n{font-family:var(--mv-font-mono);font-size:9px;color:var(--mv-text-muted);text-align:center;}
</style></head>
<body><div class="wrap"><div class="scale">
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-950)"></div><div class="n">950</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-900)"></div><div class="n">900·tinta</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-800)"></div><div class="n">800</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-700)"></div><div class="n">700</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-600)"></div><div class="n">600</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-500)"></div><div class="n">500</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-400)"></div><div class="n">400</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-300)"></div><div class="n">300</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-200)"></div><div class="n">200·borda</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-100)"></div><div class="n">100</div></div>
  <div class="sw"><div class="chip" style="background:var(--mv-neutral-50)"></div><div class="n">50·bg</div></div>
</div></div></body></html>
