<!-- @dsCard group="Brand" viewport="700x180" name="O símbolo — M em barras ascendentes" subtitle="Monetário na forma, evolução no movimento · barra alta à direita = direção" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);color:var(--mv-text-primary);}
  .wrap{padding:24px;display:flex;gap:28px;align-items:center;}
  .stage{width:150px;height:130px;flex:none;background:var(--mv-neutral-50);border-radius:16px;display:flex;align-items:center;justify-content:center;}
  h3{font-family:var(--mv-font-display);font-weight:600;font-size:22px;letter-spacing:-0.01em;margin:0 0 8px;}
  p{margin:0;font-size:14px;line-height:1.55;color:var(--mv-text-secondary);max-width:420px;}
  .etym{display:flex;gap:8px;margin-top:14px;}
  .etym span{font-size:12px;font-weight:600;padding:5px 11px;border-radius:999px;background:var(--mv-cobalt-50);color:var(--mv-cobalt-800);}
</style></head>
<body><div class="wrap">
  <div class="stage"><img src="../assets/monevo-mark.svg" height="92" alt="símbolo Monevo" /></div>
  <div>
    <h3>Um “M” que é um gráfico.</h3>
    <p>Quatro colunas crescentes formam a perna do M e leem-se como barras subindo. A mais alta à direita é o destaque: para onde o dinheiro vai. Calmo e preciso, nunca eufórico.</p>
    <div class="etym"><span>monetário</span><span>+</span><span>evolução</span></div>
  </div>
</div></body></html>
