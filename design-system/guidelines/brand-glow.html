<!-- @dsCard group="Brand" viewport="700x190" name="Glow cobalto — só em hero escuro" subtitle="Único gradiente permitido · nunca sobre o símbolo · sem outros gradientes" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);}
  .wrap{padding:20px;}
  .hero{position:relative;height:148px;border-radius:16px;background:var(--mv-neutral-900);overflow:hidden;display:flex;align-items:center;padding:0 28px;}
  .hero .glow{position:absolute;width:360px;height:360px;right:-60px;top:-120px;background:var(--mv-glow-cobalt);pointer-events:none;}
  .hero h3{position:relative;font-family:var(--mv-font-display);color:#fff;font-weight:600;font-size:26px;letter-spacing:-0.01em;margin:0;}
  .hero p{position:relative;color:var(--mv-neutral-300);font-size:13px;margin:6px 0 0;}
</style></head>
<body><div class="wrap"><div class="hero">
  <div class="glow"></div>
  <div>
    <h3>A próxima decisão segura.</h3>
    <p>radial-gradient(circle, rgba(37,80,204,0.40), transparent 70%)</p>
  </div>
</div></div></body></html>
