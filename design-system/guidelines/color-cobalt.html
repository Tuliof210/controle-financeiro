<!-- @dsCard group="Colors" viewport="700x150" name="Cobalto — ação primária + marca" subtitle="Única cor de ação · texto sobre cobalto é sempre branco" -->
<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);}
  .wrap{padding:20px;display:flex;gap:20px;align-items:stretch;}
  .scale{display:grid;grid-template-columns:repeat(9,1fr);gap:6px;flex:1;}
  .sw{display:flex;flex-direction:column;gap:6px;}
  .chip{height:52px;border-radius:8px;border:1px solid var(--mv-border-subtle);}
  .n{font-family:var(--mv-font-mono);font-size:9px;color:var(--mv-text-muted);text-align:center;}
  .rule{width:170px;background:var(--mv-cobalt-600);border-radius:12px;color:#fff;padding:14px;display:flex;flex-direction:column;justify-content:center;}
  .rule b{font-family:var(--mv-font-display);font-size:18px;font-weight:600;}
  .rule small{font-size:11px;opacity:.85;margin-top:4px;}
  .hex{font-family:var(--mv-font-mono);font-size:10px;opacity:.7;margin-top:8px;}
</style></head>
<body><div class="wrap">
  <div class="scale">
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-50)"></div><div class="n">50</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-100)"></div><div class="n">100</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-200)"></div><div class="n">200</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-300)"></div><div class="n">300</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-400)"></div><div class="n">400</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-500)"></div><div class="n">500</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-600);outline:2px solid var(--mv-cobalt-300);outline-offset:1px"></div><div class="n">600·ação</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-700)"></div><div class="n">700</div></div>
    <div class="sw"><div class="chip" style="background:var(--mv-cobalt-900)"></div><div class="n">900</div></div>
  </div>
  <div class="rule"><b>Texto branco</b><small>sempre, sobre cobalto. Nunca preto.</small><div class="hex">#2550CC · #FFFFFF</div></div>
</div></body></html>
