<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" />
<link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);color:var(--mv-text-primary);}
  .wrap{padding:24px;display:flex;flex-direction:column;gap:14px;}
  .m{font-family:var(--mv-font-mono);font-variant-numeric:tabular-nums;}
  .eyebrow{font-family:var(--mv-font-mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mv-text-muted);font-weight:500;}
  .chips{display:flex;gap:10px;flex-wrap:wrap;}
  .chip{background:var(--mv-neutral-100);border:1px solid var(--mv-border);border-radius:6px;padding:6px 10px;font-family:var(--mv-font-mono);font-size:12px;color:var(--mv-text-secondary);}
</style></head>
<body><div class="wrap">
  <div class="eyebrow">Panorama do mês</div>
  <div class="chips">
    <span class="chip">2026-08</span>
    <span class="chip">txn_9f2a-71c</span>
    <span class="chip">#2550CC</span>
    <span class="chip">R$ 1.250,90</span>
    <span class="chip">62%</span>
  </div>
  <div class="m" style="font-size:13px;color:var(--mv-text-muted)">IBM Plex Mono · 400/500/600 · tabular-nums</div>
</div></body></html>
