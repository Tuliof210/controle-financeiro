<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8" /><link rel="stylesheet" href="../styles.css" />
<style>
  body{margin:0;background:var(--mv-surface);font-family:var(--mv-font-sans);}
  .wrap{padding:20px;display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}
  .stage{height:96px;border-radius:12px;display:flex;align-items:center;justify-content:center;border:1px solid var(--mv-border-subtle);}
  .dark{background:var(--mv-neutral-900);}
  .cobalt{background:var(--mv-cobalt-600);}
  .cap{font-family:var(--mv-font-mono);font-size:9px;color:var(--mv-text-muted);text-align:center;margin-top:8px;}
  img{display:block;}
</style></head>
<body><div class="wrap">
  <div><div class="stage"><img src="../assets/monevo-lockup.svg" height="34" alt="Monevo" /></div><div class="cap">lockup · claro</div></div>
  <div><div class="stage"><img src="../assets/monevo-mark.svg" height="56" alt="M" /></div><div class="cap">símbolo</div></div>
  <div><div class="stage dark"><img src="../assets/monevo-lockup-reversed.svg" height="34" alt="Monevo" /></div><div class="cap">negativa · escuro</div></div>
  <div><div class="stage cobalt"><img src="../assets/monevo-icon.svg" height="64" alt="app" /></div><div class="cap">app icon</div></div>
</div></body></html>
