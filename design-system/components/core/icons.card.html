<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<link rel="stylesheet" href="../../styles.css" />
<style>
  body { margin: 0; background: var(--mv-bg); font-family: var(--mv-font-sans); color: var(--mv-text-primary); }
  .wrap { padding: 24px; }
  .grid { display: grid; grid-template-columns: repeat(9, 1fr); gap: 16px; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 6px; color: var(--mv-text-primary); }
  .cell span { font-family: var(--mv-font-mono); font-size: 9px; color: var(--mv-text-muted); }
</style>
</head>
<body>
<div id="root" class="wrap"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
  const { Icon, MV_ICONS } = window.MonevoDesignSystem_f93edc;
  function Demo() {
    return (
      <div className="grid">
        {Object.keys(MV_ICONS).map((n) => (
          <div className="cell" key={n}>
            <Icon name={n} size={22} color="var(--mv-text-primary)" />
            <span>{n}</span>
          </div>
        ))}
      </div>
    );
  }
  ReactDOM.createRoot(document.getElementById("root")).render(<Demo />);
</script>
</body>
</html>
