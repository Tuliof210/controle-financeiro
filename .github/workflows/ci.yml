name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  # One job spec, one check per gate: the PR lists "CI / Tipos", "CI / Build", …
  # so the failing gate is readable from the PR instead of only inside Actions.
  verificar:
    name: ${{ matrix.nome }}
    runs-on: ubuntu-latest
    strategy:
      # Sem fail-fast: uma falha nao cancela as irmas, senao o PR mostra
      # "cancelled" no lugar do resultado de cada gate.
      fail-fast: false
      matrix:
        include:
          - nome: Lint e formatacao
            comando: npm run lint
          - nome: Tipos
            comando: npx tsc --noEmit
          - nome: Testes e cobertura
            comando: npm run test:coverage
          - nome: Build
            comando: npm run build
    steps:
      - uses: actions/checkout@v4
        with:
          # check-line-cap.sh diffs against main; a shallow clone has no such ref
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Client do Prisma
        run: npx prisma generate
      - name: ${{ matrix.nome }}
        # o checkout so cria refs/remotes/origin/*, entao o BASE default `main`
        # do check-line-cap.sh nao resolve e o cap passaria vazio
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
        run: ${{ matrix.comando }}
