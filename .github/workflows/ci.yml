name: CI
on:
  pull_request:
  push:
    branches: [main, develop]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  verificar:
    name: Verificar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # check-line-cap.sh diffs against main; a shallow clone has no such ref
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Client do Prisma
        run: npx prisma generate
      - name: Lint e formatacao (Biome)
        run: npm run lint
      - name: Tipos
        run: npx tsc --noEmit
      - name: Testes e cobertura
        run: npm run test:coverage
      - name: Build
        run: npm run build
