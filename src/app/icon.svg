<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <title>Monevo</title>
  <!-- The only raw hexes in src/ outside the token partials: an SVG served as a
       static asset cannot read a CSS custom property. Kept in lockstep by hand —
       #2550CC is --cobalt-600, #FFFFFF is --white. Geometry is the kit favicon:
       a cobalt tile with the four-bar M in white. -->
  <rect width="32" height="32" rx="7.4" fill="#2550CC" />
  <g fill="#FFFFFF" transform="translate(8,8) scale(0.5)">
    <rect x="4.5" y="10" width="4.6" height="17" rx="2.3" />
    <rect x="11.5" y="18" width="4.6" height="9" rx="2.3" />
    <rect x="18" y="14" width="4.6" height="13" rx="2.3" />
    <rect x="24.9" y="5" width="4.6" height="22" rx="2.3" />
  </g>
</svg>
