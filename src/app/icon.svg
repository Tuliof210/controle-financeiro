<svg width="36" height="36" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
  <title>Monevo</title>
  <!-- The only raw hexes in src/ outside the token partials: an SVG served as a
       static asset cannot read a CSS custom property. Kept in lockstep by hand —
       #2550cc is --cobalt-600, #14171c is --neutral-900, #bbcbfa is
       --cobalt-200, and rx matches --radius-sm. Geometry is unchanged: this is
       a reskin, not a new mark. -->
  <rect x="1" y="1" width="34" height="34" rx="6" fill="#2550cc" stroke="#14171c" stroke-width="2" />
  <rect x="3" y="27" width="6" height="4" fill="#ffffff" />
  <rect x="3" y="21.5" width="6" height="4" fill="#ffffff" />
  <rect x="3" y="16" width="6" height="4" fill="#ffffff" />
  <rect x="3" y="10.5" width="6" height="4" fill="#ffffff" />
  <rect x="11" y="27" width="6" height="4" fill="#ffffff" />
  <rect x="11" y="21.5" width="6" height="4" fill="#ffffff" />
  <rect x="19" y="27" width="6" height="4" fill="#ffffff" />
  <rect x="19" y="21.5" width="6" height="4" fill="#ffffff" />
  <rect x="19" y="16" width="6" height="4" fill="#ffffff" />
  <rect x="27" y="27" width="6" height="4" fill="#ffffff" />
  <rect x="27" y="21.5" width="6" height="4" fill="#ffffff" />
  <rect x="27" y="16" width="6" height="4" fill="#ffffff" />
  <rect x="27" y="10.5" width="6" height="4" fill="#ffffff" />
  <rect x="27" y="5" width="6" height="4" fill="#bbcbfa" />
</svg>
